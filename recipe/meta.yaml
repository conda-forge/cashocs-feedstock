{% set name = "cashocs" %}
{% set version = "2.10.1" %}
{% set fenics_version = "2019.1.*" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/cashocs-{{ version }}.tar.gz
  sha256: 48a3ba0a5241d04e0843f3f82b3557eaeb3c99fa74a16a18b4ad7be3f1d1dbbc

build:
  noarch: python
  number: 0
  entry_points:
    - cashocs-convert = cashocs._cli:convert
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - setuptools
    - python {{ python_min }}
  run:
    - numpy
    - meshio >=4.1.0
    - python >={{ python_min }}
    - gmsh >=4.8
    - typing_extensions
    - openssh
    - fenics {{ fenics_version }}
    - matplotlib-base
    - scipy

test:
  requires:
    - python {{ python_min }}
  imports:
    - cashocs
    - cashocs._cli
  commands:
    - cashocs-convert --help

about:
  home: https://github.com/sblauth/cashocs
  summary: Computational Adjoint-Based Shape Optimization and Optimal Control Software
  dev_url: https://github.com/sblauth/cashocs
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: COPYING
  description: cashocs is a software for automatically solving PDE constrained shape optimization and optimal control problems.
  doc_url: https://cashocs.readthedocs.io/en/stable/

extra:
  recipe-maintainers:
    - sblauth
